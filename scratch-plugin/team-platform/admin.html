<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>团队平台管理后台</title>
  <style>
    body{margin:0;background:#f3f6fb}.page{min-height:100vh;background:radial-gradient(circle at 15% 0,#e8f3ff 0,transparent 34%),#f3f6fb}
    .content{width:min(1280px,calc(100% - 48px));margin:0 auto;padding:48px 0 72px}.header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px}
    .header h2{margin:5px 0 2px!important}.eyebrow{color:#1677ff!important;font-size:12px;font-weight:700;letter-spacing:1.4px}.stats{margin-bottom:18px}.stats .ant-card{box-shadow:0 8px 28px rgba(31,41,55,.06)}
    .tableCard{box-shadow:0 10px 36px rgba(31,41,55,.07)}.tableCard .ant-card-body{padding:0}.fieldSelect{width:122px}.avatar{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:10px;background:#e6f4ff;color:#1677ff;font-weight:700}
    .pendingRow td{background:#fffdf3!important}.centered{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 10%,#e6f4ff 0,transparent 38%),#f3f6fb}.centered>.ant-card,.centered>.ant-result{width:min(420px,100%)}.loginCard{box-shadow:0 24px 64px rgba(31,41,55,.12)}
    @media(max-width:800px){.content{width:calc(100% - 24px);padding-top:24px}.stats .ant-col{max-width:100%;flex:0 0 100%;margin-bottom:10px}.tableCard{overflow:auto}}
  </style>
</head>
<body><div id="root"></div><script src="/team/admin.js"></script></body>
</html>
