<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>团队 AI 工作台登录</title>
  <style>
    *{box-sizing:border-box}body{margin:0;color:#172033;background:#f3f6fb;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.loginPage{min-height:100vh;display:grid;grid-template-columns:minmax(360px,1.05fr) minmax(420px,.95fr);background:radial-gradient(circle at 12% 10%,#dcecff 0,transparent 34%),#f3f6fb}.hero{display:flex;flex-direction:column;justify-content:center;padding:8vw}.brand{display:flex;align-items:center;gap:12px;margin-bottom:64px;color:#1677ff;font-size:13px;font-weight:800;letter-spacing:1.8px}.brandMark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;color:#fff;background:linear-gradient(135deg,#0958d9,#69b1ff);box-shadow:0 12px 28px rgba(22,119,255,.25)}.hero h1{max-width:680px;margin:0 0 22px;font-size:clamp(42px,5vw,72px);line-height:1.08;letter-spacing:-2px}.hero p{max-width:640px;margin:0;color:#68758a;font-size:18px;line-height:1.8}.formSide{display:grid;place-items:center;padding:40px}.loginCard{width:min(460px,100%);border:0!important;border-radius:22px!important;box-shadow:0 30px 80px rgba(31,41,55,.13)}.loginCard .ant-card-body{padding:42px}.eyebrow{color:#1677ff!important;font-size:12px;font-weight:800;letter-spacing:1.6px}.switchButton{padding:0!important}.message{margin-bottom:18px!important}@media(max-width:900px){.loginPage{grid-template-columns:1fr}.hero{display:none}.formSide{padding:24px}.loginCard .ant-card-body{padding:30px}}
  </style>
</head>
<body><div id="root"></div><script src="/team/login.js"></script></body>
</html>
