<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>团队 AI 平台登录</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #f5f7fa; }
      main { width: min(360px, calc(100% - 40px)); margin: 15vh auto; padding: 28px; background: white; border-radius: 12px; box-shadow: 0 8px 30px #0001; }
      h1 { margin: 0 0 24px; font-size: 24px; }
      input, button { box-sizing: border-box; width: 100%; height: 42px; margin-top: 12px; padding: 0 12px; border-radius: 6px; }
      input { border: 1px solid #d9d9d9; }
      button { border: 0; color: white; background: #1677ff; cursor: pointer; }
      #message { min-height: 24px; margin-top: 16px; color: #d4380d; }
    </style>
  </head>
  <body>
    <main>
      <h1>团队 AI 平台登录</h1>
      <form id="login-form">
        <input id="user-id" autocomplete="username" placeholder="用户 ID" required>
        <input id="password" type="password" autocomplete="current-password" placeholder="密码" required>
        <button type="submit">登录</button>
      </form>
      <div id="message"></div>
    </main>
    <script>
      const form = document.querySelector('#login-form')
      const message = document.querySelector('#message')

      form.addEventListener('submit', async (event) => {
        event.preventDefault()
        message.textContent = '登录中…'

        try {
          const response = await fetch('/team/login', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              userId: document.querySelector('#user-id').value,
              password: document.querySelector('#password').value,
            }),
          })
          const data = await response.json()
          message.textContent = response.ok
            ? `登录成功，欢迎 ${data.user.name}`
            : data.message ?? '登录失败'
        } catch (error) {
          message.textContent = `登录失败：${error.message}`
        }
      })
    </script>
  </body>
</html>
