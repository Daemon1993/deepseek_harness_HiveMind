- insert:
    - id: team-server
      name: dsh-team-server
      disabled: !!js process.env.TEAM_ROLE === 'client'

# Server 永远使用独立的会话根；显式配置优先，缺省目录也不得与 Client 共用。
# Client 角色保留 DSH 默认根，因为该 patch 仍存在于已安装但禁用的 Server bundle 中。
- id: session-persistence-jsonl
  config:
    root: !!js >-
      process.env.TEAM_ROLE === 'client' ? dshHomePath('sessions') : (process.env.TEAM_SESSIONS_ROOT ?? dshHomePath('team-server-sessions'))
