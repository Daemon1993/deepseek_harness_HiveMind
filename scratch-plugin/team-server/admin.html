<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>团队平台管理后台</title>
  <style>
    html,body,#root{height:100%}body{margin:0;overflow:hidden;background:#f3f6fb}.page{height:100vh;overflow:hidden;background:#f3f6fb}.mainLayout{min-width:0;height:100vh;overflow-x:hidden;overflow-y:auto;background:radial-gradient(circle at 15% 0,#e8f3ff 0,transparent 34%),#f3f6fb}
    .adminSider{position:relative!important;height:100vh;border-right:1px solid #e8edf4;box-shadow:8px 0 30px rgba(31,41,55,.035)}.brand{display:flex;gap:12px;align-items:center;height:86px;padding:0 22px}.brandMark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;color:#fff;background:linear-gradient(135deg,#1677ff,#69b1ff);font-weight:800;box-shadow:0 8px 20px rgba(22,119,255,.24)}.brand .ant-typography{font-size:12px;letter-spacing:.5px}.adminSider .ant-menu{border-inline-end:0!important;padding:8px 12px}.siderUser{position:absolute;left:18px;right:18px;bottom:18px;display:flex;gap:10px;align-items:center;padding:14px;border:1px solid #edf0f5;border-radius:12px;background:#fafcff}.blockText{display:block}.topbar{position:sticky;top:0;z-index:20;height:auto!important;min-height:94px;display:flex;align-items:center;justify-content:space-between;padding:20px 32px!important;border-bottom:1px solid #e8edf4;background:rgba(255,255,255,.94)!important;backdrop-filter:blur(12px)}.topbar h3{margin:0 0 2px!important}
    .content{width:min(1320px,calc(100% - 48px));margin:0 auto;padding:28px 0 64px}.eyebrow{color:#1677ff!important;font-size:12px;font-weight:700;letter-spacing:1.4px}.stats{margin-bottom:18px}.stats .ant-card{border:0;box-shadow:0 8px 28px rgba(31,41,55,.06)}
    .tableCard,.sessionCard{border:0;box-shadow:0 10px 36px rgba(31,41,55,.07)}.tableCard .ant-card-body{padding:0}.fieldSelect{width:122px}.pendingRow td{background:#fffdf3!important}.userGroupLabel,.directoryLabel{width:100%;display:flex;align-items:center;justify-content:space-between;padding-right:12px}.sessionCard .ant-collapse{border:0;background:transparent}.sessionCard .ant-collapse-item{margin-bottom:12px;border:1px solid #edf0f5!important;border-radius:12px!important;overflow:hidden}.sessionCard .ant-collapse-header{align-items:center!important;background:#fafcff}.sessionCard .ant-table{border:1px solid #f0f0f0;border-radius:10px;overflow:hidden}.directoryGroups{margin:0!important}.directoryGroups .ant-collapse-item{margin:8px 0!important;border-color:#eef2f7!important}.directoryGroups .ant-collapse-header{background:#fff!important}.directoryPath{display:block;max-width:720px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .pendingRow td{background:#fffdf3!important}.centered{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 10%,#e6f4ff 0,transparent 38%),#f3f6fb}.centered>.ant-card,.centered>.ant-result{width:min(420px,100%)}.loginCard{box-shadow:0 24px 64px rgba(31,41,55,.12)}
    .analyticsPage{width:100%}.overviewHero{padding:22px;border:1px solid rgba(255,255,255,.8);border-radius:20px;background:linear-gradient(135deg,rgba(255,255,255,.98),rgba(240,247,255,.94));box-shadow:0 14px 42px rgba(30,64,175,.08)}.overviewHeroHead{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:18px}.overviewHeroHead h4{margin:2px 0 0!important}.rangeControl{display:flex;align-items:center;gap:10px}.primaryMetrics .ant-card{height:100%;border:1px solid #e8eef7;box-shadow:none;overflow:hidden}.primaryMetrics .ant-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#1677ff}.primaryMetrics .metricCard.purple:before{background:#7c3aed}.primaryMetrics .metricCard.green:before{background:#22a05a}.primaryMetrics .metricCard.orange:before{background:#d97706}.primaryMetrics .metricCard.red:before{background:#dc2626}.metricValue{display:flex;align-items:baseline;gap:6px;margin:8px 0 2px;font-size:28px;line-height:1.1;font-weight:750;color:#172033;letter-spacing:-.5px}.metricValue small{font-size:12px;font-weight:600;color:#64748b;letter-spacing:0}.secondaryMetrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:16px;padding:14px 6px 2px;border-top:1px solid #e8eef7}.secondaryMetrics>div{display:grid;gap:3px;padding:0 16px;border-right:1px solid #e8eef7}.secondaryMetrics>div:last-child{border-right:0}.secondaryMetrics strong{font-size:18px;color:#1e293b}.secondaryMetrics span{font-size:11px;color:#94a3b8}.analyticsStats .ant-card,.analyticsCard{border:0;box-shadow:0 8px 28px rgba(31,41,55,.06)}.analyticsStats .ant-card{height:100%}.analyticsStats .ant-card-body{min-height:130px}.usageCell{display:flex!important;width:100%}.usageCell .ant-progress{min-width:120px;flex:1}.analyticsPath{max-width:720px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.analyticsCard .ant-card-body{padding:0}.analyticsCard>.ant-card-head{border-bottom:1px solid #eef1f5}.recentSessionTitle{display:grid;gap:5px;min-width:0}.recentSessionTitle>.ant-typography{display:block;max-width:290px;margin:0}.healthCard,.trendCard{height:100%}.healthCard .ant-card-body{padding:16px 20px}.healthBadge{padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}.healthBadge.ok{color:#15803d;background:#dcfce7}.healthBadge.warn{color:#b45309;background:#fef3c7}.healthList{display:grid;gap:2px}.healthList>div{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid #f1f5f9}.healthList span{color:#64748b}.healthList strong{max-width:65%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#1e293b}.dangerText{color:#dc2626!important}.warningText{color:#d97706!important}.healthFoot{padding-top:12px;color:#94a3b8;font-size:11px}

  .chartLegend{display:flex;justify-content:flex-end;gap:16px;padding:14px 20px 0;color:#64748b;font-size:11px}.chartLegend span{display:flex;align-items:center;gap:6px}.chartLegend i{width:9px;height:9px;border-radius:3px}.legendTool{background:#1677ff}.legendModel{background:#8b5cf6}.chart-trend{display:flex;align-items:stretch;gap:10px;height:190px;padding:18px 14px 26px;position:relative}.trendGroup{display:flex;flex:1;min-width:22px;flex-direction:column;justify-content:flex-end;position:relative}.trendBars{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:100%}.chart-trend .bar{width:min(18px,42%);min-height:3px;border-radius:5px 5px 1px 1px;position:relative;transition:opacity .15s}.chart-trend .bar.tool{background:linear-gradient(180deg,#1677ff,#69b1ff)}.chart-trend .bar.model{background:linear-gradient(180deg,#7c3aed,#c4b5fd)}.chart-trend .bar:hover{opacity:.82}.chart-trend .bar .v{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:9px;color:#64748b;font-weight:600}.chart-trend .trendGroup>.d{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:10px;color:#94a3b8;white-space:nowrap}.chart-trend .bar.empty{background:#e8eef7}.chart-hbar{display:flex;flex-direction:column;gap:8px}.chart-hbar .row{display:flex;align-items:center;gap:10px}.chart-hbar .lbl{width:130px;flex-shrink:0;font-size:12.5px;color:#475569;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}.chart-hbar .trk{flex:1;height:16px;background:#f0f4fa;border-radius:8px;overflow:hidden}.chart-hbar .fill{height:100%;border-radius:8px;background:linear-gradient(90deg,#0b5bd6,#69b1ff);display:flex;align-items:center;justify-content:flex-end;padding-right:6px;color:#fff;font-size:10.5px;font-weight:700;min-width:14px}.chart-hbar .fill.green{background:linear-gradient(90deg,#22a05a,#52c41a)}.chart-hbar .fill.purple{background:linear-gradient(90deg,#7c3aed,#a78bfa)}.chart-hbar .val{width:60px;flex-shrink:0;font-size:12.5px;font-weight:600;color:#334155}.chart-donut{display:flex;align-items:center;gap:24px;flex-wrap:wrap}.chart-donut .ring{width:150px;height:150px;border-radius:50%;position:relative;flex-shrink:0}.chart-donut .ring .hole{position:absolute;inset:22px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center}.chart-donut .legend{display:flex;flex-direction:column;gap:6px;min-width:180px}.chart-donut .lg{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#475569}.chart-donut .lg .dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}.chart-donut .lg .pct{margin-left:auto;font-weight:600;color:#334155}</style>
  <style>.dimensionToolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 18px;border:1px solid #e8eef7;border-radius:14px;background:rgba(255,255,255,.8)}@media(max-width:800px){.dimensionToolbar{align-items:flex-start;flex-direction:column}}</style>
